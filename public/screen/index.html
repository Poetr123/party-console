<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Party Console Screen</title>

<link rel="stylesheet" href="/shared/styles.css">
</head>

<body>

<div id="screen">

<div id="header">
  <h1>LOCAL PARTY CONSOLE</h1>
  <div id="ip"></div>
</div>

<div id="lobbySection">
  <h2>PLAYERS</h2>

  <div id="lobby">
    <div class="player-slot" id="slot-0"></div>
    <div class="player-slot" id="slot-1"></div>
    <div class="player-slot" id="slot-2"></div>
    <div class="player-slot" id="slot-3"></div>
  </div>

  <h2>GAMES</h2>
  <div id="gameRow"></div>
</div>

<div id="setupOverlay" style="display:none">
  <div id="setupCard">
    <div id="setupTitle"></div>
    <div id="setupSubtitle"></div>
    <div id="setupBody"></div>
    <div id="setupHint"></div>
  </div>
</div>

<div id="gameContainer"></div>

</div>

<script src="/socket.io/socket.io.js"></script>
<script src="/shared/tankMaps.js"></script>
<script src="/core/gameLoader.js"></script>
<script src="screen.js"></script>

</body>
</html>
